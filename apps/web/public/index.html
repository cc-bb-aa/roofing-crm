<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roofing CRM · Chester County</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; display: grid; grid-template-columns: 280px 1fr 360px; height: 100vh; }
    aside, .rail { background: #111814; color: #e8efe9; padding: 0.8rem; overflow: auto; }
    h1 { font-size: 1rem; margin: 0 0 0.6rem; }
    .disabled { opacity: 0.45; pointer-events: none; }
    #map { height: 100%; }
    label { display: block; font-size: 0.8rem; margin: 0.4rem 0; }
    button { margin: 0.2rem 0.2rem 0.2rem 0; }
    .lead { border-bottom: 1px solid #2a3; padding: 0.4rem 0; font-size: 0.85rem; }
    .hit { border-bottom: 1px solid #243; padding: 0.35rem 0; cursor: pointer; }
    textarea { width: 100%; }
  </style>
</head>
<body>
  <aside>
    <h1>Roofing CRM</h1>
    <p>Chester County, PA · lead identification</p>
    <nav>
      <div>Lead identification</div>
      <div class="disabled">Pipeline / jobs (soon)</div>
      <div class="disabled">Campaigns (soon)</div>
      <div class="disabled">Billing (soon)</div>
    </nav>
    <label>Radius miles <input id="radius" type="number" value="5" min="1" max="25" /></label>
    <label>Roof age ≥ <input id="age" type="number" value="0" /></label>
    <p style="font-size:0.75rem;opacity:.75">Age 0 shows all parcels in radius. Set 15 to keep only known construction/roof proxies.</p>
    <label><input id="open" type="checkbox" /> open county permits (Act 247 / health / EnerGov)</label>
    <button id="usePin">Search at pin</button>
    <button id="gps">Use GPS</button>
    <p id="status">Loading Oracle artifacts…</p>
  </aside>
  <div id="map"></div>
  <div class="rail">
    <h2>Matches</h2>
    <div id="hits"></div>
    <h2>Leads</h2>
    <div id="leads"></div>
    <h2>Agent</h2>
    <textarea id="q" rows="3">show me open roofing permits older than five years within five miles of West Chester</textarea>
    <button id="ask">Ask</button>
    <pre id="agent" style="white-space:pre-wrap;font-size:12px"></pre>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./crm.js"></script>
</body>
</html>
